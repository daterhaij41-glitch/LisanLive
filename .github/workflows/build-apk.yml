name: Build LisanLive 2.2.0 Audio APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LisanLive-Android-Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK 2.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract and verify source project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ARCHIVE="LisanLive-Android-Source.zip"

          if [[ ! -s "$SOURCE_ARCHIVE" ]]; then
            echo "::error::Source ZIP not found: $SOURCE_ARCHIVE"
            exit 1
          fi

          unzip -tq "$SOURCE_ARCHIVE"

          DEST="$RUNNER_TEMP/lisanlive-source"
          mkdir -p "$DEST"
          unzip -q "$SOURCE_ARCHIVE" -d "$DEST"

          mapfile -t SETTINGS_FILES < <(
            find "$DEST" -type f -name settings.gradle.kts -print
          )

          if [[ "${#SETTINGS_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one settings.gradle.kts file."
            exit 1
          fi

          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"

          REQUIRED_FILES=(
            "app/build.gradle.kts"
            "app/src/main/java/com/lisanlive/app/MainActivity.kt"
            "app/src/main/java/com/lisanlive/app/LiveTranslateService.kt"
            "app/src/main/java/com/lisanlive/app/ModelInstaller.kt"
            "app/src/main/AndroidManifest.xml"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -s "$PROJECT_DIR/$file" ]]; then
              echo "::error::Missing project file: $file"
              exit 1
            fi
          done

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Source project located and verified."

      - name: Verify LisanLive 2.2.0 source
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APP="$PROJECT_DIR/app/build.gradle.kts"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/lisanlive/app/LiveTranslateService.kt"
          ACTIVITY="$PROJECT_DIR/app/src/main/java/com/lisanlive/app/MainActivity.kt"

          grep -Fq 'versionCode = 5' "$APP"
          grep -Fq 'versionName = "2.2.0"' "$APP"
          grep -Fq 'AudioPlaybackCaptureConfiguration' "$SERVICE"
          grep -Fq 'monitorAudioSignal' "$SERVICE"
          grep -Fq 'ACTION_START_MIC' "$SERVICE"
          grep -Fq 'show_source' "$SERVICE"
          grep -Fq 'audio_level' "$ACTIVITY"

          if grep -Fq 'ACTION_START_SCREEN' "$SERVICE"; then
            echo "::error::Unexpected screen-capture action found."
            exit 1
          fi

          if grep -Fq 'TextRecognition' "$SERVICE"; then
            echo "::error::Unexpected text recognition code found."
            exit 1
          fi

          if grep -Fq 'lastFinal' "$SERVICE"; then
            echo "::error::Old repeated-phrase filter found."
            exit 1
          fi

          echo "LisanLive 2.2.0 source checks passed."

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Verify and collect APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/LisanLive-2.2.0-debug.apk

          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Upload LisanLive APK
        uses: actions/upload-artifact@v4
        with:
          name: LisanLive-2.2.0-Audio-APK
          path: apk-output/LisanLive-2.2.0-debug.apk
          if-no-files-found: error
          retention-days: 14
