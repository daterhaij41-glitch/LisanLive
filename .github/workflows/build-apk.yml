
name: Build LisanLive APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download repository files
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract and locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="LisanLive-Android-Source.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Source ZIP file was not found."
            exit 1
          fi

          SOURCE_DIR="$RUNNER_TEMP/lisanlive-source"
          mkdir -p "$SOURCE_DIR"

          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          WRAPPER="$(find "$SOURCE_DIR" -type f -name gradlew -print -quit)"

          if [[ -z "$WRAPPER" ]]; then
            echo "::error::No Gradle wrapper was found in the ZIP archive."
            echo "The archive must contain a complete Android Gradle project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project found at: $PROJECT_DIR"

      - name: Install Android SDK platform
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          COMPILE_SDK="$(
            grep -RhoE 'compileSdk(Version)?[[:space:]]*(=[[:space:]]*|[[:space:]]+)[0-9]+' \
              --include='*.gradle' \
              --include='*.gradle.kts' \
              "$PROJECT_DIR" 2>/dev/null \
            | grep -oE '[0-9]+' \
            | head -n 1 || true
          )"

          if [[ -z "$COMPILE_SDK" ]]; then
            echo "::warning::Could not detect compileSdk. Using Android 35 as fallback."
            COMPILE_SDK=35
          fi

          echo "Installing Android platform $COMPILE_SDK"

          sdkmanager --install "platforms;android-${COMPILE_SDK}"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          TASK_LIST="$(./gradlew --no-daemon --console=plain tasks --all)"

          BUILD_TASK="$(
            printf '%s\n' "$TASK_LIST" \
            | awk '$1 ~ /(^|:)assembleDebug$/ { print $1; exit }'
          )"

          if [[ -z "$BUILD_TASK" ]]; then
            BUILD_TASK=":app:assembleDebug"
          elif [[ "$BUILD_TASK" != "assembleDebug" && "$BUILD_TASK" != :* ]]; then
            BUILD_TASK=":$BUILD_TASK"
          fi

          echo "Running Gradle task: $BUILD_TASK"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --console=plain \
            "$BUILD_TASK"

      - name: Collect generated APK files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"
          mkdir -p "$OUTPUT_DIR"

          COUNT=0

          while IFS= read -r -d '' APK; do
            RELATIVE_PATH="${APK#"$PROJECT_DIR"/}"
            SAFE_NAME="${RELATIVE_PATH//\//_}"

            cp "$APK" "$OUTPUT_DIR/$SAFE_NAME"

            echo "Collected: $SAFE_NAME"
            COUNT=$((COUNT + 1))
          done < <(
            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -path '*/build/outputs/apk/*' \
              -print0
          )

          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::The build finished but no APK file was found."
            exit 1
          fi

          echo "Total APK files: $COUNT"

      - name: Upload LisanLive APK
        uses: actions/upload-artifact@v7
        with:
          name: LisanLive-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7
          
