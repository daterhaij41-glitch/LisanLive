name: Build LisanLive 2.2.0 Audio APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'LisanLive-Android-Source.zip'
      - 'LisanLive-Android-Source-*.zip'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK 2.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Locate and extract source archive
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ARCHIVE="LisanLive-Android-Source.zip"
          if [[ ! -f "$SOURCE_ARCHIVE" ]]; then
            mapfile -t CANDIDATES < <(find . -maxdepth 2 -type f -name 'LisanLive-Android-Source*.zip' -print | sort)
            if [[ ${#CANDIDATES[@]} -eq 1 ]]; then
              SOURCE_ARCHIVE="${CANDIDATES[0]}"
            else
              echo "::error::Upload one source archive named LisanLive-Android-Source.zip. Found: ${CANDIDATES[*]:-none}"
              exit 1
            fi
          fi
          DEST="$RUNNER_TEMP/lisanlive-source"
          mkdir -p "$DEST"
          unzip -q "$SOURCE_ARCHIVE" -d "$DEST"
          SETTINGS_FILE="$(find "$DEST" -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::settings.gradle.kts was not found in the source archive"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          for file in \
            app/build.gradle.kts \
            app/src/main/java/com/lisanlive/app/MainActivity.kt \
            app/src/main/java/com/lisanlive/app/LiveTranslateService.kt \
            app/src/main/java/com/lisanlive/app/ModelInstaller.kt \
            app/src/main/AndroidManifest.xml; do
            test -s "$PROJECT_DIR/$file" || { echo "::error::Missing project file: $file"; exit 1; }
          done
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using source archive: $SOURCE_ARCHIVE"
          echo "Project root: $PROJECT_DIR"

      - name: Verify audio-only source and version
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          grep -q 'versionCode = 5' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "2.2.0"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'AudioPlaybackCaptureConfiguration' "$PROJECT_DIR/app/src/main/java/com/lisanlive/app/LiveTranslateService.kt"
          grep -q 'monitorAudioSignal' "$PROJECT_DIR/app/src/main/java/com/lisanlive/app/LiveTranslateService.kt"
          grep -q 'ACTION_START_MIC' "$PROJECT_DIR/app/src/main/java/com/lisanlive/app/LiveTranslateService.kt"
          grep -q 'show_source' "$PROJECT_DIR/app/src/main/java/com/lisanlive/app/LiveTranslateService.kt"
          grep -q 'audio_level' "$PROJECT_DIR/app/src/main/java/com/lisanlive/app/MainActivity.kt"
          ! grep -q 'ACTION_START_SCREEN' "$PROJECT_DIR/app/src/main/java/com/lisanlive/app/LiveTranslateService.kt"
          ! grep -q 'TextRecognition' "$PROJECT_DIR/app/src/main/java/com/lisanlive/app/LiveTranslateService.kt"
          ! grep -q 'text-recognition' "$PROJECT_DIR/app/build.gradle.kts"
          ! grep -q 'lastFinal' "$PROJECT_DIR/app/src/main/java/com/lisanlive/app/LiveTranslateService.kt"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Verify APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Upload LisanLive APK
        uses: actions/upload-artifact@v4
        with:
          name: LisanLive-2.2.0-Audio-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
