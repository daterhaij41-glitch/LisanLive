name: Build LisanLive 2.4.0 Whisper APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'LisanLive-Android-Source-v2.4.0.zip'

permissions:
  contents: read

jobs:
  build:
    name: Build LisanLive 2.4.0 with local Turkish Whisper
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract LisanLive source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ARCHIVE="LisanLive-Android-Source-v2.4.0.zip"
          test -s "$SOURCE_ARCHIVE" || { echo "::error::Missing $SOURCE_ARCHIVE"; exit 1; }
          unzip -tq "$SOURCE_ARCHIVE"
          DEST="$RUNNER_TEMP/lisanlive-source"
          mkdir -p "$DEST"
          unzip -q "$SOURCE_ARCHIVE" -d "$DEST"
          mapfile -t SETTINGS_FILES < <(find "$DEST" -type f -name settings.gradle.kts -print)
          [[ "${#SETTINGS_FILES[@]}" -eq 1 ]] || { echo "::error::Expected one settings.gradle.kts"; exit 1; }
          PROJECT_DIR="$(dirname "${SETTINGS_FILES[0]}")"
          for file in \
            app/build.gradle.kts \
            app/src/main/java/com/lisanlive/app/MainActivity.kt \
            app/src/main/java/com/lisanlive/app/LiveTranslateService.kt \
            app/src/main/java/com/lisanlive/app/WhisperModelInstaller.kt \
            app/src/main/AndroidManifest.xml; do
            test -s "$PROJECT_DIR/$file" || { echo "::error::Missing source file: $file"; exit 1; }
          done
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned whisper.cpp Android engine
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp.git "$PROJECT_DIR/whisper.cpp"
          JNI="$PROJECT_DIR/whisper.cpp/examples/whisper.android/lib/src/main/jni/whisper/jni.c"
          LIB_GRADLE="$PROJECT_DIR/whisper.cpp/examples/whisper.android/lib/build.gradle"
          test -s "$JNI"
          test -s "$LIB_GRADLE"
          grep -Fq 'params.language = "en";' "$JNI"
          sed -i 's/params.language = "en";/params.language = "tr";/' "$JNI"
          sed -i 's/params.print_realtime = true;/params.print_realtime = false;/' "$JNI"
          if ! grep -Fq 'kotlinx-coroutines-android' "$LIB_GRADLE"; then
            sed -i "/^dependencies {/a\\    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'" "$LIB_GRADLE"
          fi
          grep -Fq 'params.language = "tr";' "$JNI"
          grep -Fq 'kotlinx-coroutines-android' "$LIB_GRADLE"

      - name: Verify LisanLive Whisper integration
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APP="$PROJECT_DIR/app/build.gradle.kts"
          SETTINGS="$PROJECT_DIR/settings.gradle.kts"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/lisanlive/app/LiveTranslateService.kt"
          grep -Fq 'versionCode = 8' "$APP"
          grep -Fq 'versionName = "2.4.0"' "$APP"
          grep -Fq 'implementation(project(":whisperlib"))' "$APP"
          grep -Fq 'project(":whisperlib").projectDir' "$SETTINGS"
          grep -Fq 'transcribeFinalWithWhisper' "$SERVICE"
          grep -Fq 'WhisperModelInstaller' "$SERVICE"
          grep -Fq 'AudioPlaybackCaptureConfiguration' "$SERVICE"
          grep -Fq 'ACTION_START_MIC' "$SERVICE"
          if grep -Fq 'TextRecognition' "$SERVICE"; then
            echo "::error::Unexpected OCR code found in audio-only service."; exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Verify and upload APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p apk-output
          cp "$APK" apk-output/LisanLive-2.4.0-Whisper-debug.apk
          echo "APK size: $(stat -c%s "$APK") bytes"

      - name: Upload LisanLive APK
        uses: actions/upload-artifact@v4
        with:
          name: LisanLive-2.4.0-Whisper-APK
          path: apk-output/LisanLive-2.4.0-Whisper-debug.apk
          if-no-files-found: error
          retention-days: 14
