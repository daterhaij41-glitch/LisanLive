name: Build LisanLive APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$RUNNER_TEMP/lisanlive-source"
          mkdir -p "$SOURCE_DIR"

          unzip -q LisanLive-Android-Source.zip -d "$SOURCE_DIR"

          SETTINGS_FILE="$(find "$SOURCE_DIR" -name settings.gradle.kts -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "::error::App module not found"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Fix Turkish model download source
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/lisanlive/app/ModelInstaller.kt"
          content = path.read_text(encoding="utf-8")

          old_url = "https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip"
          new_url = "https://huggingface.co/rhasspy/vosk-models/resolve/main/tr/vosk-model-small-tr-0.3.zip"

          if old_url not in content:
              raise SystemExit("Model URL not found; patch cancelled")

          content = content.replace(old_url, new_url, 1)
          content = content.replace("connectTimeout = 20_000", "connectTimeout = 30_000", 1)
          content = content.replace("readTimeout = 60_000", "readTimeout = 180_000", 1)

          path.write_text(content, encoding="utf-8")
          print("Turkish model downloader updated successfully.")
          PY

      - name: Install Android platform
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          COMPILE_SDK="$(grep -RhoE 'compileSdk(Version)?[[:space:]]*(=[[:space:]]*|[[:space:]]+)[0-9]+' \
            --include='*.gradle.kts' "$PROJECT_DIR" \
            | grep -oE '[0-9]+' | head -n 1 || true)"

          if [[ -z "$COMPILE_SDK" ]]; then
            COMPILE_SDK=35
          fi

          sdkmanager --install "platforms;android-${COMPILE_SDK}"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Collect APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          mkdir -p apk-output

          find "$PROJECT_DIR" -type f -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            -exec cp {} apk-output/ \;

          if ! ls apk-output/*.apk >/dev/null 2>&1; then
            echo "::error::No APK was generated"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: LisanLive-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 7
